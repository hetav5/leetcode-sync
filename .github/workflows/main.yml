name: LeetCode to Notion Sync

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv
      
      - name: Sync — Me
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SOLVED_BY: Me
        run: python leetcode_to_notion.py

      # - name: Sync — Friend
      #   env:
      #     LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION_FRIEND }}
      #     LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF_FRIEND }}
      #     LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME_FRIEND }}
      #     NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      #     NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      #     SOLVED_BY: Friend
      #   run: python leetcode_to_notion.py

      - name: Notify on failure (optional)
        if: failure()
        run: echo "❌ Sync failed! Check logs above. A LeetCode session cookie may have expired."
