<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080810;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .widget {
      width: 100%;
      max-width: 340px;
      padding: 1.25rem 1.25rem 1.5rem;
      border: 1px solid #21262d;
      border-radius: 16px;
      background: #0e0f1c;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      margin: 1rem;
    }

    .widget::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #f97316, #f59e0b, transparent);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
    }

    .month-label {
      font-size: 1rem;
      font-weight: 600;
      color: #e6edf3;
      letter-spacing: 0.02em;
    }

    .nav-btns {
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      background: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.15s;
      line-height: 1;
    }

    .nav-btn:hover {
      border-color: #f97316;
      color: #f97316;
      background: rgba(249, 115, 22, 0.06);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day-name {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: #f59e0b;
      letter-spacing: 0.06em;
      padding: 4px 0 6px;
      text-transform: uppercase;
    }

    .day {
      text-align: center;
      font-size: 0.82rem;
      color: #8b949e;
      padding: 6px 0;
      border-radius: 6px;
      cursor: default;
      transition: background 0.15s, color 0.15s;
    }

    .day:hover {
      background: #21262d;
      color: #e6edf3;
    }

    .day.today {
      background: #f97316;
      color: #0d1117;
      font-weight: 700;
      border-radius: 50%;
    }

    .day.other-month {
      color: #30363d;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <span class="month-label" id="monthLabel"></span>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn">&#8249;</button>
        <button class="nav-btn" id="nextBtn">&#8250;</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const MONTHS   = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAY_ABBR = ['Su','Mo','Tu','We','Th','Fr','Sa'];

    const now = new Date();
    let viewYear  = now.getFullYear();
    let viewMonth = now.getMonth();

    function render() {
      const todayDate  = now.getDate();
      const todayMonth = now.getMonth();
      const todayYear  = now.getFullYear();

      document.getElementById('monthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      DAY_ABBR.forEach(d => {
        const el = document.createElement('div');
        el.className = 'day-name';
        el.textContent = d;
        grid.appendChild(el);
      });

      const firstDay     = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth  = new Date(viewYear, viewMonth + 1, 0).getDate();
      const prevDays     = new Date(viewYear, viewMonth, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const el = document.createElement('div');
        el.className = 'day other-month';
        el.textContent = prevDays - firstDay + 1 + i;
        grid.appendChild(el);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const el = document.createElement('div');
        el.className = 'day';
        el.textContent = d;
        if (d === todayDate && viewMonth === todayMonth && viewYear === todayYear) {
          el.classList.add('today');
        }
        grid.appendChild(el);
      }

      const filled = firstDay + daysInMonth;
      const remaining = filled % 7 === 0 ? 0 : 7 - (filled % 7);
      for (let i = 1; i <= remaining; i++) {
        const el = document.createElement('div');
        el.className = 'day other-month';
        el.textContent = i;
        grid.appendChild(el);
      }
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
    });

    render();
  </script>
</body>
</html>
