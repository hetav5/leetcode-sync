<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #191919;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      overflow: hidden;
    }

    .widget {
      text-align: center;
      padding: 2.5rem 3rem;
      background: #191919;
    }

    .time-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0;
      line-height: 1;
    }

    .hm {
      font-size: 4.5rem;
      font-weight: 700;
      color: #e6edf3;
      letter-spacing: -0.02em;
    }

    .sep {
      font-size: 4rem;
      color: #f59e0b;
      font-weight: 300;
      animation: blink 1s step-end infinite;
      margin: 0 2px;
      align-self: center;
    }

    .sec {
      font-size: 2.2rem;
      font-weight: 500;
      color: #f97316;
      align-self: flex-end;
      margin-bottom: 0.35rem;
      min-width: 2.8ch;
    }

    .ampm {
      font-size: 1rem;
      color: #8b949e;
      font-weight: 400;
      align-self: flex-end;
      margin-bottom: 0.45rem;
      margin-left: 0.4rem;
      letter-spacing: 0.05em;
    }

    .date-row {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #8b949e;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .day-row {
      margin-top: 0.3rem;
      font-size: 0.78rem;
      color: #484f58;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="time-row">
      <span class="hm" id="hm">00:00</span>
      <span class="sep">:</span>
      <span class="sec" id="sec">00</span>
      <span class="ampm" id="ampm">AM</span>
    </div>
    <div class="date-row" id="date"></div>
    <div class="day-row" id="day"></div>
  </div>

  <script>
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    function tick() {
      const now = new Date();
      let h = now.getHours();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('hm').textContent   = `${String(h).padStart(2,'0')}:${m}`;
      document.getElementById('sec').textContent  = s;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('date').textContent =
        `${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
      document.getElementById('day').textContent  = DAYS[now.getDay()];
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
